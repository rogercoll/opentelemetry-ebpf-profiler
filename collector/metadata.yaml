type: profiling
github_project: open-telemetry/opentelemetry-ebpf-profiler
scope_name: go.opentelemetry.io/ebpf-profiler/collector

status:
  disable_codecov_badge: true
  class: receiver
  stability:
    development: [profiles]
  distributions: [ebpf-profiler]
tests:
  skip_lifecycle: true

telemetry:
